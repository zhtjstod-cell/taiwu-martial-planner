name: Release portable Taiwu extractor

on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 (예: v1.3.0)"
        required: true
        default: "v1.3.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build embedded Python UI extractor
        run: python -m pip install UnityPy==1.25.0 pyinstaller==6.19.0
      - name: Prepare Windows portable runtimes
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $runtime = Join-Path $PWD ".release-runtime"
          New-Item -ItemType Directory -Force -Path "$runtime\node", "$runtime\dotnet", "$runtime\ilspy", "$runtime\licenses" | Out-Null
          $node = (Get-Command node.exe).Source
          Copy-Item -LiteralPath $node -Destination "$runtime\node\node.exe"
          $nodeLicense = Join-Path (Split-Path $node -Parent) "LICENSE"
          if (Test-Path -LiteralPath $nodeLicense) { Copy-Item -LiteralPath $nodeLicense -Destination "$runtime\node\LICENSE" }
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile .release-work-dotnet-install.ps1
          & .\.release-work-dotnet-install.ps1 -Channel 8.0 -Runtime dotnet -InstallDir "$runtime\dotnet" -NoPath
          dotnet tool install ilspycmd --version 9.1.0.7988 --tool-path "$runtime\ilspy"
          python -m PyInstaller --noconfirm --clean --onedir --name taiwu-ui-extractor --distpath "$runtime\ui" --workpath ".release-work\pyinstaller" --specpath ".release-work" --collect-data UnityPy --hidden-import UnityPy.resources --hidden-import UnityPy.export.SpriteHelper --hidden-import UnityPy.export.Texture2DConverter --exclude-module UnityPy.export.AudioClipConverter --exclude-module astc_encoder --exclude-module numpy --exclude-module fmod_toolkit --exclude-module pyfmodex extractor\extract-ui-assets.py
          python scripts\collect-runtime-licenses.py "$runtime\licenses"
          $env:DOTNET_ROOT = "$runtime\dotnet"
          $env:PATH = "$runtime\dotnet;$($env:PATH)"
          & "$runtime\node\node.exe" --version
          & "$runtime\ilspy\ilspycmd.exe" --version
          & "$runtime\ui\taiwu-ui-extractor\taiwu-ui-extractor.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "Bundled UI extractor smoke test failed: $LASTEXITCODE" }
      - name: Prepare Linux portable runtimes
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime="$PWD/.release-runtime"
          mkdir -p "$runtime/node" "$runtime/dotnet" "$runtime/ilspy" "$runtime/licenses"
          cp "$(command -v node)" "$runtime/node/node"
          node_license="$(dirname "$(command -v node)")/LICENSE"
          [[ ! -f "$node_license" ]] || cp "$node_license" "$runtime/node/LICENSE"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o .release-work-dotnet-install.sh
          bash .release-work-dotnet-install.sh --channel 8.0 --runtime dotnet --install-dir "$runtime/dotnet" --no-path
          dotnet tool install ilspycmd --version 9.1.0.7988 --tool-path "$runtime/ilspy"
          python -m PyInstaller --noconfirm --clean --onedir --name taiwu-ui-extractor --distpath "$runtime/ui" --workpath ".release-work/pyinstaller" --specpath ".release-work" --collect-data UnityPy --hidden-import UnityPy.resources --hidden-import UnityPy.export.SpriteHelper --hidden-import UnityPy.export.Texture2DConverter --exclude-module UnityPy.export.AudioClipConverter --exclude-module astc_encoder --exclude-module numpy --exclude-module fmod_toolkit --exclude-module pyfmodex extractor/extract-ui-assets.py
          python scripts/collect-runtime-licenses.py "$runtime/licenses"
          chmod +x "$runtime/node/node" "$runtime/dotnet/dotnet" "$runtime/ilspy/ilspycmd" "$runtime/ui/taiwu-ui-extractor/taiwu-ui-extractor"
          export DOTNET_ROOT="$runtime/dotnet"
          export PATH="$runtime/dotnet:$PATH"
          "$runtime/node/node" --version
          "$runtime/ilspy/ilspycmd" --version
          "$runtime/ui/taiwu-ui-extractor/taiwu-ui-extractor" --help
      - name: Package portable extractor
        run: node scripts/build-extractor-release.mjs "${{ inputs.version }}" --platform "${{ matrix.platform }}" --runtime .release-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: extractor-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: extractor-*
          path: release-assets
          merge-multiple: true
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd release-assets
          sha256sum taiwu-martial-extractor-windows-*.zip taiwu-martial-extractor-linux-*.tar.gz > "taiwu-martial-extractor-${VERSION}-SHA256SUMS.txt"
          assets=(taiwu-martial-extractor-windows-*.zip taiwu-martial-extractor-linux-*.tar.gz "taiwu-martial-extractor-${VERSION}-SHA256SUMS.txt")
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VERSION" "${assets[@]}" --latest --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
              --title "태오회권 무공 추출기 ${VERSION} · 무설치 Windows + Linux/Proton" \
              --notes "Node.js, Python/UnityPy, .NET 8 런타임과 ILSpy를 포함한 포터블 릴리스입니다. 사용자는 운영체제용 압축 파일만 풀어 실행하면 되며 별도 개발 도구 설치나 첫 실행 다운로드가 필요하지 않습니다."
          fi
